# Alembic config for OUR tables only (AGENT_DB_SCHEMA). Aegra manages its own tables.
# Keep this file ASCII: alembic reads it with the OS locale encoding (cp949 on Korean Windows).
# Connection info is NOT here; migrations/env.py reads POSTGRES_* and AGENT_DB_SCHEMA from .env.
# Usage: see docs/02 (python -m study_notes.db migrate | sql, alembic revision --autogenerate -m "...")

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = src
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
