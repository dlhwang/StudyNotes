[project]
name = "study-notes"
version = "0.1.0"
description = "학습 노트 비서 — Streamlit(FE) · FastAPI(BE) · Aegra 위 LangGraph 멀티 에이전트"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.16,<2",
    "langgraph-sdk>=0.3.5",
    "langchain-core>=1.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyyaml>=6",
    "sqlalchemy[asyncio]>=2.0",  # asyncio: greenlet 포함 (async 세션·Alembic 오프라인 DDL에 필요)
]

[project.optional-dependencies]
# 실행 서버. Python 3.12 이상, PostgreSQL 필요
server = ["aegra-cli>=0.12,<0.13"]
# 실제 모델 호출
llm = ["litellm>=1.50"]
# DB에 붙을 때: 실행 기록 저장, 마이그레이션(Alembic)
postgres = ["asyncpg>=0.30", "alembic>=1.13"]
# BE: FastAPI + Vector DB(Chroma)
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "chromadb>=1.0"]
# FE: Streamlit
ui = ["streamlit>=1.40"]
# MCP 서버
mcp = ["mcp>=1.2"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/study_notes", "src/notes_api", "src/notes_ui", "src/notes_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",   # 한글 문서·주석의 전각 기호
    "S101",                         # 테스트의 assert
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 의존성 주입 기본값
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["study_notes", "notes_api", "notes_ui", "notes_mcp"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*", "asyncpg", "asyncpg.*", "alembic", "alembic.*", "chromadb", "chromadb.*", "streamlit", "streamlit.*"]
ignore_missing_imports = true
